name: Build, Test & Release (Windows x64)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $ver = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            $cmake = Get-Content "CMakeLists.txt" -Raw
            if ($cmake -match 'project\(SplitASIO VERSION ([0-9]+\.[0-9]+\.[0-9]+)') {
              $ver = $Matches[1]
            } else {
              $ver = "1.0.0"
            }
          }
          Write-Host "Resolved version: $ver"
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Configure CMake (Auto-detect Visual Studio x64)
        shell: pwsh
        run: cmake -B build -A x64

      - name: Build Debug & Release
        shell: pwsh
        run: |
          cmake --build build --config Debug
          cmake --build build --config Release

      - name: Run Unit Tests (CTest)
        shell: pwsh
        run: |
          ctest --test-dir build -C Debug --output-on-failure
          ctest --test-dir build -C Release --output-on-failure

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $iscc) {
            Write-Host "Inno Setup 6 not preinstalled; installing via Chocolatey..."
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup 6 (ISCC.exe) not found."
          }

          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" "installer\split_asio.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed." }

          $setup = Get-Item "dist\SplitASIO-Setup-${{ steps.version.outputs.version }}-x64.exe"
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash
          "$hash  $($setup.Name)" | Out-File -FilePath "dist\SHA256SUMS.txt" -Encoding ascii
          Get-Content "dist\SHA256SUMS.txt"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SplitASIO-Setup-${{ steps.version.outputs.version }}-x64
          path: |
            dist/SplitASIO-Setup-*.exe
            dist/SHA256SUMS.txt

  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Installer Artifact
        uses: actions/download-artifact@v4
        with:
          name: SplitASIO-Setup-${{ needs.build-and-test.outputs.version }}-x64
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/SplitASIO-Setup-*.exe
            dist/SHA256SUMS.txt
